name: Weekly SEO audit

# Crawls your site (brand.site in engine.config.json) and writes seo-audit/reports/latest.md.
# Works with no secrets. Optional: variable AUDIT_MAX_PAGES; secret PSI_API_KEY for PageSpeed (Core Web Vitals).

on:
  schedule:
    - cron: "0 7 * * 1"   # engine:seo_audit (rewrite with: python3 setup/schedule.py)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to crawl"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser (only if seo_audit.render_js is true)
        run: |
          if python3 -c 'import json,sys;sys.exit(0 if json.load(open("engine.config.json")).get("seo_audit",{}).get("render_js") else 1)' 2>/dev/null; then
            pip install playwright && python3 -m playwright install --with-deps chromium
          fi
      - name: Audit
        env:
          AUDIT_MAX_PAGES: ${{ github.event.inputs.max_pages || vars.AUDIT_MAX_PAGES }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          [ -f engine.config.json ] || { echo "::notice::Not set up yet — run python3 setup/init.py and commit engine.config.json (docs/SETUP.md)."; exit 0; }
          if [ -n "$PSI_API_KEY" ]; then python3 seo-audit/audit.py --psi; else python3 seo-audit/audit.py; fi
      - name: Commit
        run: |
          git config user.name "seo-audit-bot"
          git config user.email "seo-audit-bot@users.noreply.github.com"
          git add -A seo-audit/reports/
          git diff --staged --quiet || git commit -m "SEO audit $(date -u +%F) [skip ci]"
          git pull --rebase && git push
