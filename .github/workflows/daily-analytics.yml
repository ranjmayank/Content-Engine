name: Daily search & analytics pull

# Pulls Google Search Console + GA4, writes analytics/reports/latest.md and analytics/opportunities.json.
# Needs: secret GOOGLE_SERVICE_ACCOUNT_JSON, variables GSC_SITE_URL and/or GA4_PROPERTY_ID (see docs/SETUP.md, step 5).
# Skips quietly until they are set.

on:
  schedule:
    - cron: "45 7 * * *"   # engine:analytics (rewrite with: python3 setup/schedule.py)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        id: check
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then echo "GOOGLE_SERVICE_ACCOUNT_JSON is not set yet — skipping (docs/SETUP.md step 5)."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
        if: steps.check.outputs.skip != '1'
      - name: Pull Search Console + GA4
        if: steps.check.outputs.skip != '1'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python3 analytics/fetch.py
      - name: Analyse (Mondays also add the weekly tracker row)
        if: steps.check.outputs.skip != '1'
        run: |
          if [ "$(date +%u)" = "1" ]; then python3 analytics/analyze.py --tracker; else python3 analytics/analyze.py; fi
      - name: Commit
        if: steps.check.outputs.skip != '1'
        run: |
          git config user.name "analytics-bot"
          git config user.email "analytics-bot@users.noreply.github.com"
          git add -A analytics/ tracker/
          git diff --staged --quiet || git commit -m "Analytics $(date -u +%F) [skip ci]"
          git pull --rebase && git push
