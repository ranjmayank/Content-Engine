name: Daily topic list (Claude API)

# Optional: builds today's topic list with the Claude API instead of a Claude scheduled task.
# Needs: secret ANTHROPIC_API_KEY. Optional variables CLAUDE_MODEL, TOPIC_WEB_SEARCH (set 0 to disable web search).
# Skips quietly until the secret is set. Runs after the scan and before the email.

on:
  schedule:
    - cron: "15 10 * * *"   # engine:topic_list (rewrite with: python3 setup/schedule.py)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ] || [ ! -f engine.config.json ]; then echo "No ANTHROPIC_API_KEY (or not set up) — skipping."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Build the list
        if: steps.check.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TOPIC_WEB_SEARCH: ${{ vars.TOPIC_WEB_SEARCH }}
        run: python3 tools/build_topic_list.py
      - name: Commit
        if: steps.check.outputs.skip != '1'
        run: |
          git config user.name "topic-list-bot"
          git config user.email "topic-list-bot@users.noreply.github.com"
          git add -A content/topic-lists/
          git diff --staged --quiet || git commit -m "Topic list $(date -u +%F) [skip ci]"
          git pull --rebase && git push
