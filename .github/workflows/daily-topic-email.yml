name: Daily topic email

# Emails today's topic list (or the scanner's top picks if the topic-list task didn't run).
# Needs: secrets SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS (MAIL_FROM optional), variable MAIL_TO.

on:
  schedule:
    - cron: "0 11 * * *"   # engine:email (rewrite with: python3 setup/schedule.py)
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        id: check
        env:
          HOST: ${{ secrets.SMTP_HOST }}
          TO: ${{ vars.MAIL_TO }}
        run: |
          if [ -z "$HOST" ] || [ -z "$TO" ]; then echo "Email isn't set up yet — skipping (docs/SETUP.md step 6)."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Send today's topic list
        if: steps.check.outputs.skip != '1'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          TOPIC_PAGE_URL: ${{ vars.TOPIC_PAGE_URL }}
        run: python3 tools/send_topic_email.py
